<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Scanner</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐀 IOT Ratter</h1>
      <p>Select an available network</p>
    </div>
    <div class="content">
      <div id="statusMessage" class="status-message"></div>
      <div class="button-group">
        <button class="scan-btn" id="scanBtn" onclick="scanNetworks()">🔍 Scan Networks</button>
        <button class="refresh-btn" onclick="location.reload()">⟳</button>
        <button class="reset-btn" onclick="resetPreferences()">🔄 Reset WiFi</button>
      </div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Scanning for networks...</p>
      </div>
      <div id="networkListContainer" style="display: none;">
        <div class="network-list" id="networkList"></div>
        <div style="margin-top: 20px;">
          <div id="passwordContainer" style="display: none; margin-bottom: 15px;">
            <label for="passwordInput" style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">WiFi Password:</label>
            <input type="password" id="passwordInput" placeholder="Enter WiFi password" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
          </div>
          <button class="scan-btn" style="width: 100%;" id="connectBtn" onclick="connectToSelected()" disabled>
            Connect to Selected Network
          </button>
        </div>
      </div>
      <div class="empty-state" id="emptyState">
        <p>Click "Scan Networks" to find available WiFi networks</p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
