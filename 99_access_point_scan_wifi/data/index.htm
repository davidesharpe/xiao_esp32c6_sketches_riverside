<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Scanner</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🐀 IOT Ratter</h1>
      <p>Select an available network</p>
    </div>
    <div class="content">
      <div id="statusMessage" class="status-message"></div>
      
      <div class="device-name-section">
        <div class="device-name-display">
          <span id="deviceNameText" style="font-weight: 600; font-size: 16px;">Loading...</span>
          <button class="edit-name-btn" onclick="toggleEditDeviceName()">✏️</button>
        </div>
        <div id="deviceNameEditContainer" style="display: none; margin-bottom: 15px;">
          <input type="text" id="deviceNameInput" placeholder="Enter device name" maxlength="32" style="width: 100%; padding: 10px; border: 2px solid #667eea; border-radius: 5px; font-size: 14px; box-sizing: border-box; margin-bottom: 8px;">
          <div style="display: flex; gap: 8px;">
            <button onclick="saveDeviceName()" style="flex: 1; padding: 8px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">Save</button>
            <button onclick="toggleEditDeviceName()" style="flex: 1; padding: 8px; background: #f0f0f0; color: #333; border: 2px solid #e0e0e0; border-radius: 5px; cursor: pointer;">Cancel</button>
          </div>
        </div>
      </div>
      
      <div class="button-group">
        <button class="scan-btn" id="scanBtn" onclick="scanNetworks()">🔍 Scan Networks</button>
        <button class="refresh-btn" onclick="location.reload()">⟳</button>
        <button class="reset-btn" onclick="resetPreferences()">🔄 Reset WiFi</button>
      </div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Scanning for networks...</p>
      </div>
      <div id="networkListContainer" style="display: none;">
        <div class="network-list" id="networkList"></div>
        <div style="margin-top: 20px;">
          <div id="passwordContainer" style="display: none; margin-bottom: 15px;">
            <label for="passwordInput" style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">WiFi Password:</label>
            <input type="password" id="passwordInput" placeholder="Enter WiFi password" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; box-sizing: border-box;">
          </div>
          <button class="scan-btn" style="width: 100%;" id="connectBtn" onclick="connectToSelected()" disabled>
            Connect to Selected Network
          </button>
        </div>
      </div>
      <div class="empty-state" id="emptyState">
        <p>Click "Scan Networks" to find available WiFi networks</p>
      </div>
      <div class="sleep-section" style="margin-top: 25px; text-align: center;">
        <button class="sleep-btn" onclick="enterDeepSleep()">💤 Deep Sleep for 30 seconds</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
